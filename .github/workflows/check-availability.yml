name: Check Centro Arlington Availability

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and can lag
    # a few minutes during high load, but 15 min is a safe interval.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run availability check
        env:
          FLOORPLAN_CODES: ${{ vars.FLOORPLAN_CODES }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_GATEWAY_EMAIL: ${{ secrets.SMS_GATEWAY_EMAIL }}
        run: npm run check

      - name: Commit updated state
        run: |
          git config user.name "availability-bot"
          git config user.email "availability-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update availability state [skip ci]"
          git push
